spring:
  profiles:
    active: @profile.active@

groupbuy:
  transaction:
    # 默认关闭，避免未配置 PostgreSQL 时影响现有模块；启用后才注册数据源、Mapper 和交易接口。
    enabled: ${GROUPBUY_TRANSACTION_ENABLED:false}
    datasource:
      jdbc-url: ${GROUPBUY_POSTGRES_JDBC_URL:}
      postgres-dsn: ${POSTGRES_DSN:}
      username: ${GROUPBUY_POSTGRES_USERNAME:}
      password: ${GROUPBUY_POSTGRES_PASSWORD:}
      maximum-pool-size: ${GROUPBUY_POSTGRES_POOL_SIZE:20}
      minimum-idle: ${GROUPBUY_POSTGRES_MIN_IDLE:2}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: 9999
  undertow:
    # HTTP post内容的最大大小。当值为-1时，默认值为大小是无限的
    max-http-post-size: -1
    # 以下的配置会影响buffer,这些buffer会用于服务器连接的IO操作,有点类似netty的池化内存管理
    # 每块buffer的空间大小,越小的空间被利用越充分
    buffer-size: 512
    # 是否分配的直接内存
    direct-buffers: true
    threads:
      # 设置IO线程数, 它主要执行非阻塞的任务,它们会负责多个连接, 默认设置每个CPU核心一个线程
      io: 8
      # 阻塞任务线程池, 当执行类似servlet请求阻塞操作, undertow会从这个线程池中取得线程,它的值设置取决于系统的负载
      worker: 256


lock4j:
  acquire-timeout: 3000
  expire: 30000

version: '3.8'

services:
  langgraph-api:
    build:
      context: ..
      dockerfile: py/Dockerfile
    image: biasoo/langgraph-api:1.0.6
    container_name: langgraph-api
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - PYTHONPATH=/app/py
      - TZ=Asia/Shanghai
      - OPENAI_API_KEY=sk-FfWxnznnlBbvU8pWEx98aaLYeuJzCYeXqBWirrYuw9D597S8
      - OPENAI_API_BASE=https://api.chatanywhere.org/v1
      - MEILI_HTTP_ADDR=http://192.168.9.166:7700/
      - MEILI_API_KEY=admin
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DATABASE=14
      - REDIS_PASSWORD=${REDIS_PASSWORD:-dudu0.0@}
      - USE_REDIS_SESSIONS=true
      - USE_REDIS_USER_STORE=true
      - USE_REDIS_CHAT=true
      - CHAT_HISTORY_LIMIT=0
      - CHAT_HISTORY_TTL_SECONDS=604800
      - POSTGRES_DSN=postgresql://root:dudu0.0%40@postgres-db:5432/tool_hub
    restart: unless-stopped
    networks:
      - linger-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: dudu0.0@
      POSTGRES_DB: tool_hub
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - /docker/pgsql/data/:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - linger-net

networks:
  linger-net:
    external: true
